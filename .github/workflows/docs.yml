name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/shadcn-ui/**'
      - '.github/workflows/docs.yml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  # Changesets publishes GitHub Releases, and the changelog page is built from
  # them. A release run's ref is the tag, which the github-pages environment
  # (main only) rejects, so the `redispatch` job re-runs this workflow on main.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # https://docs.torcato.dev/react-common/ (Storybook at /react-common/storybook/,
  # built by the docs app's `build` script).
  # Pinned to a tag, never @main: this job hands over the Cloudflare secrets.
  cloudflare:
    if: github.event_name != 'release'
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@v6.0.0
    with:
      build-filter: '@rtorcato/react-common-docs'
      worker-name: react-common-docs
      base-path: /react-common/
      route: docs.torcato.dev/react-common/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Old site: rtorcato.github.io/react-common/ now only redirects to the new address.
  # GitHub Pages can't redirect server-side, so every path gets a meta-refresh
  # stub (index.html, plus 404.html so deep links land on the same page there).
  # ponytail: delete these two jobs once Pages is disabled in the repo settings.
  pages-redirect-build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect stub
        run: |
          mkdir -p stub
          cat > stub/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>react-common docs have moved</title>
          <link rel="canonical" href="https://docs.torcato.dev/react-common/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://docs.torcato.dev/react-common/">
          <script>
          location.replace('https://docs.torcato.dev' + location.pathname + location.search + location.hash)
          </script>
          </head>
          <body>
          <p>The react-common docs have moved to <a href="https://docs.torcato.dev/react-common/">docs.torcato.dev/react-common</a>.</p>
          </body>
          </html>
          EOF
          cp stub/index.html stub/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: stub

  pages-redirect-deploy:
    needs: pages-redirect-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
