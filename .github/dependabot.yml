version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    # Let brand-new releases settle before opening a PR — keeps grouped bumps
    # from tripping pnpm's minimumReleaseAge supply-chain check (a same-day
    # release fails the frozen-lockfile install in CI).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    # TypeScript majors remove config options (7.0 dropped baseUrl) — those are a
    # deliberate migration, not a dependabot bump. Take minor/patch only.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # react is a prod dep in apps/docs but a dev/peer dep in the packages, so
      # the production/development split below would ship it in two PRs. React
      # errors on mismatched react/react-dom, so claim it first as one group.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Safe tier: runtime + dev minor/patch auto-merge on green (see the
      # dependabot-automerge workflow).
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Majors batch into one PR per ecosystem — breaking by definition, so
      # never auto-merged; triaged on the monthly cadence.
      major-updates:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
